[package]
name = "rasterizer"
version = "0.3.1"
edition = "2024"

[features]
default = ["window", "obj"]
window = ["dep:winit", "dep:softbuffer"]
obj = ["dep:tobj"]
gltf = ["dep:gltf", "dep:image"]

[dependencies]
winit = { version = "0.30.13", optional = true }
softbuffer = { version = "0.4.8", optional = true }
tobj = { version = "4.0.3", optional = true }
gltf = { version = "1.4", optional = true, default-features = false, features = ["utils", "extensions", "allow_empty_texture"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }

[[bin]]
name = "rasterizer"
path = "src/main.rs"
required-features = ["window", "obj"]
