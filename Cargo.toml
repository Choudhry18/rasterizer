[package]
name = "rasterizer"
version = "0.2.0"
edition = "2024"

[features]
default = ["window", "obj"]
window = ["dep:winit", "dep:softbuffer"]
obj = ["dep:tobj"]
gltf = ["dep:gltf"]

[dependencies]
winit = { version = "0.30.13", optional = true }
softbuffer = { version = "0.4.8", optional = true }
tobj = { version = "4.0.3", optional = true }
gltf = { version = "1.4", optional = true, default-features = false, features = ["utils"] }

[[bin]]
name = "rasterizer"
path = "src/main.rs"
required-features = ["window", "obj"]
